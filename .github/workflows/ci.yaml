name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby-version: '3.1', rails-version: '7.1' }
          - { ruby-version: '3.3', rails-version: '7.2' }
          - { ruby-version: '3.3', rails-version: '8.0' }
          - { ruby-version: '3.4', rails-version: '8.1' }

    env:
      RAILS_VERSION: ${{ matrix.rails-version }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      # The dummy app's sqlite3 files are gitignored, so a fresh checkout has no
      # database. test_helper adds the engine's own db/migrate to migrations_paths,
      # and those three migrations then read as pending unless they are run here.
      - name: Create db
        run: RAILS_ENV=test bundle exec rake db:create db:migrate --trace
      - name: Run tests
        run: bundle exec rake
